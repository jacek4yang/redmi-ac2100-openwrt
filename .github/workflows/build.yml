name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # reused by release.yml

# Least privilege: this workflow only reads the repository. It also runs on
# pull requests from forks, so it must never gain a write token; no secrets
# are configured on this repository at all.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: verify-repo
        run: bash scripts/verify-repo.sh

  build:
    name: Build OpenWrt 25.12.2 (${{ matrix.flavor }}) - ramips/mt7621 Redmi AC2100
    needs: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # base = lean fallback (config/base.config only)
        # full = base + observability/optional packages (config/performance.config)
        flavor: [base, full]
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Full OpenWrt builds incl. host-side Go (pulled in by tailscale in the
      # full flavor) exceed the free disk on a stock runner: run 35438257237
      # failed 2 h in with golang1.26-host and ppp dying simultaneously, and
      # run 35444693304 measured the runner at 14 GB free before this step vs
      # 42 GB after (df evidence in its logs) - then compiled through image
      # generation. Only unused preinstalled toolchains are removed; every
      # removal is optional-safe.
      - name: Free disk space
        run: |
          echo "--- disk before cleanup ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/azcopy \
            /usr/local/sqlpackage /usr/lib/mono /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -a -f 2>/dev/null || true
          sudo apt-get clean || true
          echo "--- disk after cleanup ---"; df -h /

      - name: Install build dependencies
        run: |
          # Package list per official OpenWrt build-system docs (Ubuntu 24.04):
          # https://openwrt.org/docs/guide-developer/toolchain/install-buildsystem
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      # Safe caching only: upstream source tarballs (dl/) and the
      # content-addressed compiler cache. Build state (build_dir/staging_dir)
      # is deliberately NOT cached - it would compromise reproducibility.
      # dl/ is shared across flavors (superset is harmless; the build only
      # fetches what the flavor's config needs). ccache is per-flavor.
      - name: Cache OpenWrt source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/openwrt/dl
          key: openwrt-dl-25.12.2
          restore-keys: openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/openwrt/.ccache
          key: openwrt-ccache-25.12.2-${{ matrix.flavor }}-${{ github.run_id }}
          restore-keys: openwrt-ccache-25.12.2-${{ matrix.flavor }}-

      - name: Prepare pinned OpenWrt tree (clone, verify commit, feeds, config, overlay)
        run: bash scripts/prepare.sh

      - name: Build firmware (defconfig, verify config, download, make, verify images)
        run: bash scripts/build.sh

      # Evidence for future resource tuning; runs even when the build fails.
      - name: Measure disk usage (post-build evidence)
        if: always()
        run: |
          df -h / || true
          du -sh work/openwrt/dl work/openwrt/build_dir work/openwrt/staging_dir work/openwrt/.ccache 2>/dev/null || true
          du -sh work/openwrt/build_dir/* 2>/dev/null | sort -rh | head -8 || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redmi-ac2100-firmware-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            work/openwrt/bin/targets/ramips/mt7621/*xiaomi_redmi-router-ac2100*
            work/openwrt/bin/targets/ramips/mt7621/SHA256SUMS
            work/openwrt/bin/targets/ramips/mt7621/build-metadata.txt
            work/openwrt/bin/targets/ramips/mt7621/config.buildinfo
            work/openwrt/bin/targets/ramips/mt7621/profiles.json
          if-no-files-found: error
          retention-days: 14
