name: source-build

# Full OpenWrt Buildroot from pinned source (v25.12.2, commit-verified).
# This pipeline exists for source-level work: kernel, DTS, patches, drivers,
# PPE, initramfs. It builds ONE canonical config (config/base.config = device
# profile + LuCI + initramfs + ccache; package variants are ImageBuilder's
# job - see imagebuilder.yml).
#
# Triggers: manual, or pushes that touch source-level inputs. Docs-only and
# package-list changes never trigger this multi-hour build. A later push must
# not cancel a running build (cancel-in-progress: false).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/base.config'
      - 'patches/**'
      - 'scripts/prepare.sh'
      - 'scripts/verify-config.sh'
      - 'scripts/verify-images.sh'
      - 'scripts/build.sh'
      - '.github/workflows/source-build.yml'

# Least privilege: read-only; no secrets exist on this repository.
permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Full Buildroot (canonical source config)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # OpenWrt wraps compilers with ccache (CONFIG_CCACHE=y in base.config)
      # but never sets CCACHE_DIR itself - without this the cache lands in
      # ~/.cache/ccache, which is NOT the path we cache, and nothing is ever
      # restored (observed on runs 35452208528/35460747904). Must be absolute:
      # build steps cd into work/openwrt.
      CCACHE_DIR: ${{ github.workspace }}/work/openwrt/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "[ENV] runner facts"
        run: |
          nproc
          free -h
          uname -a

      # Run 35438257237 died 2 h in (golang1.26-host + ppp simultaneously) with
      # only ~14 GB free on the stock runner; run 35444693304 measured 14 GB
      # before this cleanup vs 42 GB after, then compiled through image
      # generation. Only unused preinstalled toolchains are removed.
      - name: "[DISK] free space + early threshold gate"
        run: |
          echo "--- before cleanup ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/azcopy \
            /usr/local/sqlpackage /usr/lib/mono /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -a -f 2>/dev/null || true
          sudo apt-get clean || true
          echo "--- after cleanup ---"; df -h /
          AVAIL_G=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available after cleanup: ${AVAIL_G}G"
          [ "${AVAIL_G}" -ge 30 ] || { echo "::error::inadequate disk after cleanup (${AVAIL_G}G < 30G)"; exit 1; }

      - name: Install build dependencies
        run: |
          # Per official OpenWrt build-system docs (Ubuntu 24.04) + zstd.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: "[CLONE+FEEDS] prepare pinned tree (clone, verify commit, feeds, config, overlay)"
        run: bash scripts/prepare.sh

      # Safe caching only: upstream source tarballs (dl/) and the
      # content-addressed compiler cache. build_dir/ and staging_dir/ are
      # never cached - that would compromise reproducibility.
      # ORDERING CONSTRAINT (run 35453035164, exit 128): restoring these
      # caches BEFORE the clone recreates work/openwrt/ non-empty, which makes
      # git clone fail ("destination path already exists and is not empty").
      # They must stay AFTER [CLONE+FEEDS]; prepare.sh hard-fails otherwise.
      - name: Cache OpenWrt source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/openwrt/dl
          key: openwrt-dl-25.12.2
          restore-keys: openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/openwrt/.ccache
          key: openwrt-ccache-src-25.12.2-${{ github.run_id }}
          restore-keys: openwrt-ccache-src-25.12.2-

      - name: "[DEFCONFIG]"
        run: |
          cd work/openwrt
          make defconfig
          ./scripts/diffconfig.sh > ../config.buildinfo

      - name: "[CONFIG VERIFY] resolved .config audit (fail fast)"
        run: bash scripts/verify-config.sh work/openwrt base

      - name: "[DOWNLOAD] sources (broken-file retry)"
        run: |
          cd work/openwrt
          make download -j"$(nproc)"
          BROKEN="$(find dl -type f -size -1024c -print)"
          if [ -n "${BROKEN}" ]; then
            echo "::warning:: deleting incomplete downloads and retrying:"
            echo "${BROKEN}"
            echo "${BROKEN}" | xargs -r rm -f
            make download -j"$(nproc)"
          fi
          if find dl -type f -size -1024c -print -quit | grep -q .; then
            echo "::error::incomplete downloads remain after retry"
            exit 1
          fi

      - name: "[COMPILE]"
        run: |
          cd work/openwrt
          if ! make -j"$(nproc)"; then
            echo "::warning:: parallel build failed; re-running with -j1 V=s for the exact error"
            make -j1 V=s
          fi

      # Separation of concerns: if THIS step fails, OpenWrt compiled but the
      # image Makefile did not emit the expected artifacts; if the next step
      # fails, the build was fine and OUR audit rejected it.
      - name: "[IMAGE GENERATION] confirm upstream artifacts exist"
        run: |
          cd work/openwrt/bin/targets/ramips/mt7621
          ls -la
          echo "---"
          ls *xiaomi_redmi-router-ac2100-squashfs-kernel1.bin \
             *xiaomi_redmi-router-ac2100-squashfs-rootfs0.bin \
             *xiaomi_redmi-router-ac2100-squashfs-sysupgrade.bin

      - name: "[CUSTOM VERIFY] our image audit"
        run: bash scripts/verify-images.sh work/openwrt/bin/targets/ramips/mt7621

      - name: "[CACHE] ccache statistics (evidence, not a failure gate)"
        if: always()
        run: |
          CCACHE_BIN="$(command -v ccache || true)"
          [ -n "${CCACHE_BIN}" ] || CCACHE_BIN="work/openwrt/staging_dir/host/bin/ccache"
          if [ -d work/openwrt/.ccache ] && [ -x "${CCACHE_BIN}" ]; then
            "${CCACHE_BIN}" -s || true
          else
            echo "no ccache dir (${CCACHE_DIR}) or no ccache binary found"
          fi

      - name: "[MEASURE] disk usage (post-build evidence)"
        if: always()
        run: |
          df -h / || true
          du -sh work/openwrt/dl work/openwrt/build_dir work/openwrt/staging_dir work/openwrt/.ccache 2>/dev/null || true
          du -sh work/openwrt/build_dir/* 2>/dev/null | sort -rh | head -8 || true

      - name: Upload development artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redmi-ac2100-source-${{ github.sha }}
          path: |
            work/openwrt/bin/targets/ramips/mt7621/*xiaomi_redmi-router-ac2100*
            work/openwrt/bin/targets/ramips/mt7621/SHA256SUMS
            work/openwrt/bin/targets/ramips/mt7621/build-metadata.txt
            work/openwrt/bin/targets/ramips/mt7621/config.buildinfo
            work/openwrt/bin/targets/ramips/mt7621/profiles.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics (non-sensitive build logs)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-build-diagnostics-${{ github.run_id }}
          path: |
            work/openwrt/logs/
            work/config.buildinfo
          if-no-files-found: warn
          retention-days: 7
